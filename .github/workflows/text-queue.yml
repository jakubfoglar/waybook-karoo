# The demand-writing queue drain (waybook place-pipeline §5.1), running HERE because this
# public repo's Actions minutes are free and unlimited — the private source is checked out
# read-only via a deploy key. Schedule + dispatch only (never pull_request: secrets stay
# unreachable from forks). Typical real cadence is 5-15 min (GitHub cron jitter).
name: text-queue
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: text-queue
  cancel-in-progress: false
permissions: {}
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jakubfoglar/waybook
          ssh-key: ${{ secrets.WAYBOOK_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: drain the text queue once
        env:
          SUPABASE_URL: https://nqtvcxztuuoywznxrxga.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: node tools/worker/drain-text-queue.mjs --once
